name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
      - master
      - refactor
      - release**
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
      - dev
      - master
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: create and checkout branch
        # push events already checked out the branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK and run jvm tests
        run: ./gradlew assembleContinuous lintContinuous testDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/continuous/*.apk

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86
          - api-level: 35
            target: default
            arch: x86_64

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Run android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          script: |
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
            bash scripts/verify-offline-android.sh
            # Keep this verification local: the excluded legacy class fetches live YouTube channels.
            bash scripts/run-local-android-regressions.sh

      - name: Report offline runtime result
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          for report in sorted(Path("app/build/reports/offline-runtime").glob("*.txt")):
              text = report.read_text()
              if re.search(r"OK \([0-9]+ tests?\)", text):
                  print(f"::notice title=Offline {report.stem}::Passed on API ${{ matrix.api-level }}")
              else:
                  detail = text[-6000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                  print(f"::error title=Offline {report.stem}::{detail}")
          import xml.etree.ElementTree as ET
          for report in Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              root = ET.parse(report).getroot()
              print(f"::notice title=Android suite::{root.get('name')} tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')}")
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      detail = (failure.get("message") or failure.text or "failed")[:1500]
                      detail = detail.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          PYTHON

      - name: Upload offline runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-runtime-api${{ matrix.api-level }}
          path: app/build/reports/offline-runtime/**

      - name: Upload test report when tests fail # because the printed out stacktrace (console) is too short, see also #7553
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/**

  sonar:
    if: ${{ false }} # the key has expired and needs to be regenerated by the sonar admins
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info
